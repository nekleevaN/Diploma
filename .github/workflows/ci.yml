name: CI

on:
  push:
    branches: [master, bugfix]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend — Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TrustMarket.sln

      - name: Build
        run: dotnet build TrustMarket.sln --no-restore --configuration Release

      - name: Run unit tests
        run: |
          find tests -name "*.UnitTests.csproj" | while read proj; do
            dotnet test "$proj" --no-build --configuration Release --verbosity normal
          done

  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
